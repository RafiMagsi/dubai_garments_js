server {
    listen 49.13.6.141:443 ssl http2;
    server_name aisales.dropticks.com;

    ssl_certificate     /home/rafiadmin/conf/web/aisales.dropticks.com/ssl/aisales.dropticks.com.pem;
    ssl_certificate_key /home/rafiadmin/conf/web/aisales.dropticks.com/ssl/aisales.dropticks.com.key;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }
}
