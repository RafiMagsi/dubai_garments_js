name: QA Regression

on:
  workflow_call:
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ secrets.QA_BASE_URL }}
      QA_ADMIN_EMAIL: ${{ secrets.QA_ADMIN_EMAIL }}
      QA_ADMIN_PASSWORD: ${{ secrets.QA_ADMIN_PASSWORD }}
      QA_SALES_MANAGER_EMAIL: ${{ secrets.QA_SALES_MANAGER_EMAIL }}
      QA_SALES_MANAGER_PASSWORD: ${{ secrets.QA_SALES_MANAGER_PASSWORD }}
      QA_SALES_REP_EMAIL: ${{ secrets.QA_SALES_REP_EMAIL }}
      QA_SALES_REP_PASSWORD: ${{ secrets.QA_SALES_REP_PASSWORD }}
      QA_OPS_EMAIL: ${{ secrets.QA_OPS_EMAIL }}
      QA_OPS_PASSWORD: ${{ secrets.QA_OPS_PASSWORD }}
    defaults:
      run:
        working-directory: apps/storefront-dubai_garments
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Preflight Required Secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=()

          required=(
            QA_BASE_URL
            QA_ADMIN_EMAIL
            QA_ADMIN_PASSWORD
            QA_SALES_MANAGER_EMAIL
            QA_SALES_MANAGER_PASSWORD
            QA_SALES_REP_EMAIL
            QA_SALES_REP_PASSWORD
            QA_OPS_EMAIL
            QA_OPS_PASSWORD
            CODECOV_TOKEN
          )

          for key in "${required[@]}"; do
            value="${!key:-}"
            if [ -z "$value" ]; then
              missing+=("$key")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required secrets:"
            for key in "${missing[@]}"; do
              echo " - $key"
            done
            exit 1
          fi

          echo "Preflight passed: all required secrets are configured."

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/storefront-dubai_garments/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run Combined QA Suite + Report
        run: npm run qa:regression

      - name: Upload QA Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-regression-artifacts
          path: |
            apps/storefront-dubai_garments/.qa
            docs/qa/regression-testing/regression-results-*.md

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/storefront-dubai_garments/.qa/coverage/lcov.info
          flags: unit-integration
          fail_ci_if_error: false
